# All limits and parameters live here (CLAUDE.md rule 6). No hardcoded
# values elsewhere in src/. Section references point to SPEC.md.
# Do not change a retention or security value here unless explicitly asked
# in-session (CLAUDE.md rule 7).

retention:                          # SPEC 5
  audio_store: false                # never true; audio is not persisted (CLAUDE.md rule 1)
  transcript_days: 30               # from meeting end
  unpinned_suggestion_days: 30      # follows the transcript
  audit_log_days: 365
  purge_cron_utc: "17 9 * * *"      # daily purge job

security:                           # SPEC 6
  session_idle_minutes: 30
  signup_enabled: false
  cipher: aes-256-gcm
  consent_reminder_per_client: true # SPEC 3.1

access_gate:                        # Phase 1 only; replaced by passkeys in Phase 2
  min_code_length: 12               # LISTENER_ACCESS_CODE shorter than this -> gate refuses all
  session_hours: 12

capture:                            # SPEC 3
  sample_rate_hz: 16000
  chunk_ms: 100                     # audio sent to the vendor in chunks of this length
  echo_cancellation: false          # browser mic processing; tune in Phase 1 testing
  noise_suppression: false
  auto_gain_control: true
  target_latency_ms: 1500
  stall_alert_seconds: 10           # no audio frames for this long -> on screen alert
  reconnect_max_attempts: 5
  reconnect_backoff_ms: [500, 1000, 2000, 4000, 8000]

stt:                                # BUILD_PLAN 1
  vendor: deepgram
  model: nova-3
  diarize: true
  interim_results: true
  smart_format: true
  mip_opt_out: true                 # opt out of vendor model improvement (SPEC 3.2)
  language: en-US
  token_ttl_seconds: 30             # temporary token only needs to be valid when the socket opens

models:                             # BUILD_PLAN 1
  live: claude-haiku-5-5            # live talking points and recall
  post: claude-sonnet-5-5           # summary, action items, feedback

assist:                             # SPEC 4
  live_interval_seconds: 30
  live_max_suggestions: 3
  live_max_latency_ms: 4000
  live_transcript_window_minutes: 10
  post_meeting_timeout_seconds: 60
  max_free_form_tags: 3

recall:                             # SPEC 4.2, BUILD_PLAN 1
  max_context_tokens: 150000        # above this, reconsider embeddings
  recent_summaries: 20

tags:                               # SPEC 4.3 controlled list
  - decision
  - pricing
  - scope
  - risk
  - timeline
  - staffing
  - legal
  - follow_up

templates:                          # SPEC 2
  general:
    watch_for: [questions_to_me, commitments, dates]
  discovery:
    watch_for: [questions_to_me, pain_points, budget, decision_makers, timeline]
  status_update:
    watch_for: [blockers, commitments, dates, scope_changes]
  sales:
    watch_for: [objections, pricing, next_steps, decision_makers]
